[project]
name = "contentmachine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.5.0",
    "av<19",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "jinja2>=3.1.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
cm = "app.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live and not whisper and not embeddings'"
markers = [
    "embeddings: vrai modèle d'embeddings, téléchargé au premier lancement",
    "live: appelle la vraie API Anthropic (payant, nécessite une clé)",
    "whisper: vraie transcription, télécharge le modèle tiny au premier lancement",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
